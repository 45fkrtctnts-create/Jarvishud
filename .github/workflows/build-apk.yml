name: Build JARVIS APK

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Extract JARVIS project
        run: unzip -o "JarvisHUD_Project.zip" -d extracted

      - name: Build APK
        run: gradle -p extracted/JarvisHUD assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JarvisHUD-APK
          path: extracted/JarvisHUD/app/build/outputs/apk/debug/app-debug.apk
