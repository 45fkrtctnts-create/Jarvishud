name: Build JARVIS APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract JARVIS project
        run: unzip -o JarvisHUD_Project.zip -d extracted

      - name: Build APK
        run: gradle -p extracted/JarvisHUD assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JarvisHUD-APK
          path: extracted/JarvisHUD/app/build/outputs/apk/debug/app-debug.apk
