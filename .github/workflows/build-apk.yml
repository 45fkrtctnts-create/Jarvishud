name: Build JARVIS APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Find and extract latest JARVIS project
        run: |
          ZIP_FILE=$(python3 - <<'PY'
          from pathlib import Path
          import re

          files = list(Path(".").glob("JarvisHUD_Project*.zip"))

          if not files:
              raise SystemExit("ERROR: JarvisHUD_Project ZIP bulunamadi.")

          def version(path):
              match = re.fullmatch(
                  r"JarvisHUD_Project(?: \((\d+)\))?\.zip",
                  path.name
              )

              if not match:
                  return -1

              return int(match.group(1) or 0)

          latest = max(files, key=version)

          if version(latest) < 0:
              raise SystemExit("ERROR: Uygun JARVIS ZIP dosyasi bulunamadi.")

          print(latest)
          PY
          )

          echo "========================================"
          echo "Using JARVIS archive: $ZIP_FILE"
          echo "========================================"

          unzip -o "$ZIP_FILE" -d extracted

      - name: Verify project
        run: |
          echo "Extracted project contents:"
          ls -la extracted/JarvisHUD

          test -f extracted/JarvisHUD/settings.gradle || {
            echo "ERROR: settings.gradle bulunamadi."
            exit 1
          }

          test -f extracted/JarvisHUD/build.gradle || {
            echo "ERROR: build.gradle bulunamadi."
            exit 1
          }

      - name: Build JARVIS APK
        run: |
          gradle -p extracted/JarvisHUD assembleDebug

      - name: Verify APK
        run: |
          APK="extracted/JarvisHUD/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK olusturulamadi."
            exit 1
          fi

          echo "APK successfully created:"
          ls -lh "$APK"

      - name: Upload JARVIS APK
        uses: actions/upload-artifact@v4
        with:
          name: JarvisHUD-APK
          path: extracted/JarvisHUD/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
